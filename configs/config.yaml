# Analog_Addicts — Final submitted configuration (v4)
# Matches models/best_model.pt exactly. Do not change these values
# without retraining, or run.py's architecture will no longer match
# the checkpoint's saved weights.

model:
  name: RestorationNet
  base_ch: 64
  n_res_blocks: 8
  in_channels: 1
  out_channels: 1
  upsample_factor: 2
  total_parameters: 3457409

data:
  train_pairs: 3200
  gt_resolution: [256, 256]
  noisylr_resolution: [128, 128]
  degradations: [speckle_noise, additive_gaussian_noise, downsampling]
  gt_value_range: [0.0, 1.0]
  noisylr_value_range: "may extend slightly outside [0,1] (intentional, per problem statement)"

training:
  loss: "combined_loss_v4 = L1 + 0.1*SSIM_loss + 0.1*VGG16-perceptual + 0.15*Sobel-edge_loss"
  loss_weights:
    l1_weight: 1.0
    ssim_weight: 0.1
    perceptual_weight: 0.1
    edge_weight: 0.15
  augmentation: [random_crop, horizontal_flip, vertical_flip, rotation_90]
  optimizer: Adam
  learning_rate: 2e-4
  lr_scheduler: "CosineAnnealingLR (T_max=40)"
  batch_size: 16
  epochs: 40
  seed: "not explicitly set in original notebook — results may vary slightly on re-run"
  warm_start: "1/58 layers transferred from best_model_v3.pt where tensor shapes matched (base_ch/n_res_blocks differ between v3 and v4, so most layers were re-initialized, not truly transferred)"

validation:
  held_out_images: 384
  metrics: [PSNR, SSIM, LPIPS]
  results:
    psnr_db: 25.70
    ssim: 0.7437
    lpips: 0.2711
    inference_speed_ms_per_image: 6.2

hardware:
  trained_on: null            # fill in, e.g. "Colab T4 GPU"
  inference_tested_on: "CPU (local); target eval hardware is NVIDIA H100 per problem statement"
